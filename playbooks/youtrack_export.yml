---
- name: Export the YouTrack server configuration to one local file
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Hub REST base. The built-in Hub of the server unless YOUTRACK_HUB_URL names another one.
    hub_url: >-
      {{ lookup('ansible.builtin.env', 'YOUTRACK_HUB_URL')
      or (lookup('ansible.builtin.env', 'YOUTRACK_URL') ~ '/hub/api/rest') }}

  pre_tasks:
    - name: Require the server, the credential location, the admin login and the export file
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'YOUTRACK_URL') | length > 0
          - lookup('ansible.builtin.env', 'BAO_ADDR') | length > 0
          - lookup('ansible.builtin.env', 'BAO_TOKEN') | length > 0
          - lookup('ansible.builtin.env', 'YOUTRACK_ADMIN_OPENBAO_MOUNT') | length > 0
          - lookup('ansible.builtin.env', 'YOUTRACK_ADMIN_OPENBAO_PATH') | length > 0
          - lookup('ansible.builtin.env', 'YOUTRACK_ADMIN_OPENBAO_FIELD') | length > 0
          - lookup('ansible.builtin.env', 'YOUTRACK_ADMIN_LOGIN') | length > 0
          - lookup('ansible.builtin.env', 'YOUTRACK_EXPORT_DEST') | length > 0
        fail_msg: >-
          Set YOUTRACK_URL, BAO_ADDR, BAO_TOKEN, YOUTRACK_ADMIN_OPENBAO_MOUNT, YOUTRACK_ADMIN_OPENBAO_PATH,
          YOUTRACK_ADMIN_OPENBAO_FIELD, YOUTRACK_ADMIN_LOGIN and YOUTRACK_EXPORT_DEST. See README.md.
        quiet: true

  tasks:
    - name: Export with a temporary token that the play deletes afterwards
      block:
        - name: Mint the temporary token
          ansible.builtin.include_tasks: tasks/temp_token_mint.yml
          vars:
            temp_token_prefix: config-export
            temp_token_allow_check: false

        - name: Export the server configuration with the temporary token
          ansible.builtin.include_role:
            name: jpe_ansible.youtrack.export
          vars:
            youtrack_url: "{{ lookup('ansible.builtin.env', 'YOUTRACK_URL') }}"
            youtrack_api_key: "{{ export_token_value }}"
            export_dest: "{{ lookup('ansible.builtin.env', 'YOUTRACK_EXPORT_DEST') }}"
          no_log: true

      always:
        - name: Delete the temporary token by its id
          ansible.builtin.include_tasks: tasks/temp_token_delete.yml
